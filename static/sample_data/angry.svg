<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="faceGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fee2e2" />
      <stop offset="100%" stop-color="#fca5a5" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1e1e2d" rx="20"/>
  <circle cx="150" cy="150" r="105" fill="url(#faceGrad)" filter="url(#shadow)" stroke="#ef4444" stroke-width="4"/>
  <!-- Sharp Angled Eyebrows (Corrugator AU4) -->
  <path d="M 85 110 L 135 135" stroke="#7f1d1d" stroke-width="7" stroke-linecap="round" />
  <path d="M 215 110 L 165 135" stroke="#7f1d1d" stroke-width="7" stroke-linecap="round" />
  <!-- Squinted Angry Eyes -->
  <ellipse cx="105" cy="148" rx="14" ry="9" fill="#1f2937" />
  <ellipse cx="195" cy="148" rx="14" ry="9" fill="#1f2937" />
  <circle cx="105" cy="148" r="4" fill="#ef4444" />
  <circle cx="195" cy="148" r="4" fill="#ef4444" />
  <!-- Flared Nostrils -->
  <path d="M 140 180 Q 150 175 160 180" stroke="#991b1b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Tight Grimaced Mouth (AU23/AU24) -->
  <path d="M 105 218 Q 150 195 195 218" stroke="#991b1b" stroke-width="8" stroke-linecap="round" fill="none" />
  <line x1="110" y1="210" x2="190" y2="210" stroke="#ffffff" stroke-width="3" stroke-dasharray="8,5" />
  <text x="150" y="280" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="middle">EMOTION: ANGRY (AU4+AU24)</text>
</svg>
